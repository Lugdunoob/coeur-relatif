name: etat
on:
  push:
    branches: [main, "regie/**", "lot-*"]
permissions:
  contents: write
  issues: write
jobs:
  etat:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: npm install
      - name: Régénérer docs/etat.md
        run: python3 .loop/scripts/etat.py .
      - name: Régénérer le tableau de bord
        run: python3 scripts/tableau-de-bord.py .
      - name: Miroir issues et jalons
        env: { GH_TOKEN: "${{ github.token }}" }
        run: bash .loop/scripts/miroir-github.sh
      - name: Commiter si changé (avec retry contre les pushes concurrents)
        run: |
          git config user.name "regie-bot"; git config user.email "regie-bot@users.noreply.github.com"
          git add docs/etat.md docs/tableau-de-bord/data.json
          git diff --cached --quiet && exit 0
          git commit -m "etat: régénéré [skip ci]"
          for i in 1 2 3; do
            git push && exit 0
            echo "push rejeté (course avec un autre push), tentative $i/3 : rebase puis retente"
            git fetch origin main
            git rebase origin/main || { git rebase --abort; git reset --soft origin/main; git stash pop 2>/dev/null || true; git add -A; git commit -m "etat: régénéré [skip ci]"; }
            sleep 3
          done
          echo "::warning::le tableau de bord n'a pas pu être poussé après 3 tentatives, ce n'est pas bloquant"
