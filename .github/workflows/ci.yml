name: ci
on: [push, pull_request]
jobs:
  verifier:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: npm install
      - name: Typecheck (bloquant, tout le dépôt)
        run: npm run typecheck
      - name: Lint (bloquant, tout le dépôt)
        run: npm run lint
      - name: Tests (informationnel tant que tous les lots ne sont pas livrés)
        # PROCESS.md règle 5 : les tests d'acceptation sont écrits pour tous les
        # critères avant tout code (carte "Tests d'acceptation"), et restent
        # rouges jusqu'à ce que leur lot les fasse passer. Un rouge partiel sur
        # main est donc l'état normal tant que le dernier lot n'est pas fusionné,
        # pas un signal d'échec : chaque lot vérifie lui-même l'absence de
        # régression avant sa propre fusion (voir docs/cartes/NN-lot-*.md).
        # Ce step redevient bloquant une fois le lot de Recette atteint.
        run: npm test
        continue-on-error: true
