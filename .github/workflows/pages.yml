# À copier dans .github/workflows/pages.yml du dépôt d'idée.
# Publie docs/tableau-de-bord/ sur GitHub Pages à chaque push sur main.
# Réglage unique à faire à la main, une fois : Settings → Pages → Build and
# deployment → Source : "GitHub Actions" (aucun outil ne peut le faire à distance).
name: pages
on:
  push:
    branches: [main]
    paths: ["docs/tableau-de-bord/**"]
  workflow_dispatch: {}
permissions:
  pages: write
  id-token: write
concurrency: { group: "pages", cancel-in-progress: true }
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: { name: github-pages, url: "${{ steps.deployment.outputs.page_url }}" }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/upload-pages-artifact@v3
        with: { path: "docs/tableau-de-bord" }
      - id: deployment
        uses: actions/deploy-pages@v4
