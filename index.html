<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Cœur relatif</title>
<link rel="manifest" href="/manifest.json">
<link rel="icon" href="/icon.svg" type="image/svg+xml">
<meta name="theme-color" content="#f4f2ec">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=JetBrains+Mono:wght@400;500;700;800&display=swap" rel="stylesheet">
<style>
  :root {
    --fond: #f4f2ec;
    --panneau: #ffffff;
    --case: #f0eee7;
    --case-bord: #e3e0d6;
    --klein: #0032c8;
    --klein-vif: #0a3ff0;
    --klein-clair: #e4ebfd;
    --encre: #14141f;
    --encre-douce: #6c6a75;
    --or: #e0a324;
    --coeur: #ef4b3c;
    --seam: rgba(0,0,0,.06);
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--fond);
    background-image:
      radial-gradient(ellipse at top, rgba(10,63,240,.05), transparent 55%);
    color: var(--encre);
    font-family: "JetBrains Mono", ui-monospace, monospace;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 32px 16px calc(32px + env(safe-area-inset-bottom));
  }
  .marque {
    font-family: "Bebas Neue", "JetBrains Mono", sans-serif;
    font-size: 2.4rem;
    letter-spacing: 0.1em;
    color: var(--klein);
    margin: 0 0 2px;
  }
  .marque-sous {
    font-size: 0.7rem;
    letter-spacing: 0.3em;
    color: var(--encre-douce);
    text-transform: uppercase;
    margin: 0 0 28px;
  }
  .carte {
    width: 100%;
    max-width: 420px;
    background: var(--panneau);
    border: 1px solid var(--case-bord);
    border-radius: 18px;
    padding: 28px 22px;
    box-shadow: 0 20px 50px rgba(20,20,50,.08);
    position: relative;
  }
  h1 {
    font-family: "Bebas Neue", sans-serif;
    font-size: 1.8rem;
    letter-spacing: 0.04em;
    margin: 0 0 4px;
    color: var(--encre);
  }
  .sous-titre { color: var(--encre-douce); font-size: 0.78rem; letter-spacing: 0.05em; margin: 0 0 20px; text-transform: uppercase; }
  p { line-height: 1.6; font-size: 0.92rem; color: var(--encre-douce); }
  .boutons { display: flex; flex-direction: column; gap: 10px; margin-top: 16px; }
  button {
    font-family: "JetBrains Mono", monospace;
    font-weight: 700;
    font-size: 0.95rem;
    letter-spacing: 0.04em;
    padding: 16px 18px;
    border-radius: 12px;
    border: 1px solid var(--case-bord);
    background: var(--case);
    color: var(--encre);
    cursor: pointer;
    text-align: center;
    box-shadow: 0 2px 0 rgba(20,20,50,.04);
  }
  button:active { transform: translateY(1px); box-shadow: none; }
  button.principal { background: var(--klein); color: #fff; border-color: var(--klein); }
  button.discret { background: transparent; border: none; box-shadow: none; color: var(--encre-douce); text-decoration: underline; font-weight: 400; }
  .etoiles { display: flex; justify-content: center; gap: 6px; margin: 22px 0; }
  .etoiles .case-etoile {
    width: 38px; height: 46px;
    background: var(--case);
    border: 1px solid var(--case-bord);
    border-radius: 8px;
    display: flex; align-items: center; justify-content: center;
    font-size: 1.3rem;
    color: var(--case-bord);
    animation: bascule .5s ease-out backwards;
  }
  .etoiles .case-etoile.pleine { color: var(--or); background: #fdf4de; border-color: #f1dfa4; }
  @keyframes bascule { from { transform: rotateX(90deg); opacity: 0; } to { transform: rotateX(0); opacity: 1; } }
  .retour { background: none; border: none; box-shadow: none; color: var(--encre-douce); padding: 0 0 18px; text-align: left; font-size: 0.75rem; letter-spacing: 0.08em; text-transform: uppercase; }

  /* Sélecteur à roues infinies (façon combinaison) */
  .roues { display: flex; gap: 10px; margin: 10px 0 20px; }
  .roue-colonne { flex: 1; min-width: 0; }
  .roue-entete { font-size: 0.65rem; letter-spacing: 0.15em; text-transform: uppercase; color: var(--encre-douce); text-align: center; margin-bottom: 6px; }
  .roue-cadre {
    position: relative;
    height: 180px;
    background: var(--case);
    border: 1px solid var(--case-bord);
    border-radius: 12px;
    overflow: hidden;
    touch-action: none;
    user-select: none;
    -webkit-user-select: none;
  }
  .roue-bande {
    position: absolute; left: 4px; right: 4px; top: 72px; height: 36px;
    border-radius: 8px;
    background: var(--klein-clair);
    box-shadow: inset 0 0 0 1px rgba(10,63,240,.25);
    pointer-events: none;
    z-index: 1;
  }
  .roue-piste {
    position: absolute; left: 0; right: 0; top: 0;
    z-index: 2;
  }
  .roue-fondu {
    position: absolute; inset: 0;
    pointer-events: none;
    z-index: 3;
    background: linear-gradient(to bottom, var(--case) 0%, transparent 32%, transparent 68%, var(--case) 100%);
  }
  .roue-item {
    position: absolute; left: 0; right: 0; top: 0;
    width: 100%; max-width: 100%; box-sizing: border-box;
    height: 36px; line-height: 36px;
    font-size: 0.72rem;
    color: var(--encre-douce);
    opacity: .45;
    text-align: center;
    padding: 0 4px;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  .roue-item.actif { opacity: 1; color: var(--klein); font-weight: 800; font-size: 0.98rem; }
  .chargement, .erreur { text-align: center; color: var(--encre-douce); margin-top: 40vh; font-size: 0.85rem; letter-spacing: 0.05em; }
  .erreur { color: var(--coeur); }
</style>
</head>
<body>
<div class="marque">CŒUR RELATIF</div>
<div class="marque-sous">Pilote · Effort relatif</div>
<div id="app" class="chargement">Chargement…</div>

<script>
const params = new URLSearchParams(location.search);
let jeton = params.get('p') || localStorage.getItem('coeur-relatif-jeton');
if (params.get('p')) localStorage.setItem('coeur-relatif-jeton', params.get('p'));

const app = document.getElementById('app');

function carte(html) {
  app.className = '';
  app.innerHTML = '<div class="carte">' + html + '</div>';
}

function panneauEtoiles(nombre) {
  let cases = '';
  for (let i = 0; i < 5; i++) {
    const pleine = i < nombre;
    cases += `<div class="case-etoile${pleine ? ' pleine' : ''}" style="animation-delay:${i * 80}ms">${pleine ? '★' : ''}</div>`;
  }
  return `<div class="etoiles">${cases}</div>`;
}

async function api(chemin, options) {
  const reponse = await fetch(chemin, options);
  const donnees = await reponse.json().catch(() => ({}));
  if (!reponse.ok) throw new Error(donnees.erreur || 'Erreur');
  return donnees;
}

async function demarrer() {
  if (!jeton) {
    app.className = 'erreur';
    app.textContent = "Lien manquant. Demande ton lien personnel au fondateur du pilote.";
    return;
  }
  try {
    const moi = await api('/api/web/moi?p=' + encodeURIComponent(jeton));
    if (!moi.consentement) {
      afficherConsentement(moi.prenom);
    } else {
      afficherMenu(moi.prenom);
    }
  } catch (e) {
    app.className = 'erreur';
    app.textContent = e.message === 'Lien invalide.' ? 'Lien invalide ou expiré.' : 'Une erreur est survenue.';
  }
}

function afficherConsentement(prenom) {
  carte(`
    <h1>Bienvenue${prenom ? ', ' + prenom : ''}</h1>
    <p class="sous-titre">Pilote « Cœur relatif »</p>
    <p>Ce qui est enregistré si tu acceptes : les activités que tu déclares (nom, durée,
    effort ressenti) et les cœurs ❤️ posés sur les séances.</p>
    <p>Ce qui n'est jamais enregistré : fréquence cardiaque, distance, allure, position,
    âge, poids — aucun de ces champs n'existe dans cette appli.</p>
    <p>Conservation : jusqu'à la fin du pilote + 30 jours, puis suppression automatique.
    Suppression à tout moment, depuis le menu.</p>
    <div class="boutons"><button class="principal" id="accepter">J'accepte</button></div>
  `);
  document.getElementById('accepter').onclick = async () => {
    await api('/api/web/accepter', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ p: jeton }) });
    demarrer();
  };
}

function afficherMenu(prenom) {
  carte(`
    <h1>Salut${prenom ? ', ' + prenom : ''}</h1>
    <p class="sous-titre">Qu'est-ce qu'on fait ?</p>
    <div class="boutons">
      <button id="declarer">Déclarer une séance</button>
      <button id="mesdonnees">Mes étoiles de la semaine</button>
      <button class="discret" id="supprimer">Supprimer mes données</button>
    </div>
  `);
  document.getElementById('declarer').onclick = demarrerDeclaration;
  document.getElementById('mesdonnees').onclick = afficherMesDonnees;
  document.getElementById('supprimer').onclick = confirmerSuppression;
}

const HAUTEUR_LIGNE = 36;
const HAUTEUR_CADRE = 180;

async function demarrerDeclaration() {
  const options = await api('/api/web/options');
  afficherRoues(options);
}

// Trois roues côte à côte (activité, durée, effort), comme une combinaison : chacune
// tourne à l'infini (mod sur la liste), avec inertie au lâcher. L'élément centré dans
// la bande bleue est le choix retenu.
function afficherRoues(options) {
  const activites = [...options.activites, 'Autre'];
  const durees = options.durees.map((d) => d.label);
  const efforts = options.efforts;

  const colonne = (id, entete) => `
    <div class="roue-colonne">
      <div class="roue-entete">${entete}</div>
      <div class="roue-cadre" id="${id}">
        <div class="roue-bande"></div>
        <div class="roue-piste"></div>
        <div class="roue-fondu"></div>
      </div>
    </div>
  `;

  carte(`
    <button class="retour" id="retour">← Menu</button>
    <h1>Déclarer</h1>
    <p class="sous-titre">Fais tourner chaque roue</p>
    <div class="roues">
      ${colonne('roue-activite', 'Activité')}
      ${colonne('roue-duree', 'Durée')}
      ${colonne('roue-effort', 'Effort')}
    </div>
    <div class="boutons"><button class="principal" id="valider">Valider</button></div>
  `);
  document.getElementById('retour').onclick = () => afficherMenu();

  const roues = [
    initRoue('roue-activite', activites),
    initRoue('roue-duree', durees),
    initRoue('roue-effort', efforts),
  ];

  document.getElementById('valider').onclick = () => {
    let activite = activites[roues[0].index()];
    if (activite === 'Autre') {
      const nom = prompt("Quelle activité ?");
      if (!nom || !nom.trim()) return;
      activite = nom.trim().slice(0, 30);
    }
    envoyerDeclaration(activite, options.durees[roues[1].index()].minutes, efforts[roues[2].index()]);
  };
}

const mod = (n, m) => ((n % m) + m) % m;

// Roue infinie façon combinaison : `pos` (continu) avance par glissement, l'inertie au
// lâcher continue de tourner puis ralentit et se cale sur l'entier le plus proche.
function initRoue(id, valeurs) {
  const cadre = document.getElementById(id);
  const piste = cadre.querySelector('.roue-piste');
  const n = valeurs.length;
  let pos = 0;
  let vitesse = 0;
  let dernierY = 0, dernierT = 0;
  let animation = null;
  let enGlissement = false;

  function rendre() {
    const centre = Math.round(pos);
    let html = '';
    for (let i = centre - 3; i <= centre + 3; i++) {
      const y = HAUTEUR_CADRE / 2 + (i - pos) * HAUTEUR_LIGNE - HAUTEUR_LIGNE / 2;
      const actif = i === Math.round(pos);
      html += `<div class="roue-item${actif ? ' actif' : ''}" style="transform:translateY(${y}px)">${valeurs[mod(i, n)]}</div>`;
    }
    piste.innerHTML = html;
  }

  function arreterAnimation() {
    if (animation) cancelAnimationFrame(animation);
    animation = null;
  }

  function boucleInertie(t) {
    if (dernierT === 0) dernierT = t;
    const dt = Math.min(t - dernierT, 48);
    dernierT = t;
    pos += vitesse * dt;
    vitesse *= Math.pow(0.994, dt);
    rendre();
    if (Math.abs(vitesse) > 0.00025) {
      animation = requestAnimationFrame(boucleInertie);
    } else {
      caler();
    }
  }

  function caler() {
    const cible = Math.round(pos);
    const depart = pos;
    const debut = performance.now();
    const duree = 180;
    function etape(t) {
      const p = Math.min(1, (t - debut) / duree);
      const ease = 1 - Math.pow(1 - p, 3);
      pos = depart + (cible - depart) * ease;
      rendre();
      if (p < 1) animation = requestAnimationFrame(etape);
      else { pos = cible; rendre(); }
    }
    animation = requestAnimationFrame(etape);
  }

  function surAppui(e) {
    arreterAnimation();
    enGlissement = true;
    dernierY = e.clientY;
    dernierT = 0;
    vitesse = 0;
    cadre.setPointerCapture(e.pointerId);
  }
  function surDeplacement(e) {
    if (!enGlissement) return;
    const maintenant = performance.now();
    const deltaY = dernierY - e.clientY;
    dernierY = e.clientY;
    pos += deltaY / HAUTEUR_LIGNE;
    if (dernierT) {
      const dt = Math.max(1, maintenant - dernierT);
      vitesse = (deltaY / HAUTEUR_LIGNE) / dt;
    }
    dernierT = maintenant;
    rendre();
  }
  function surRelache() {
    if (!enGlissement) return;
    enGlissement = false;
    dernierT = 0;
    if (Math.abs(vitesse) > 0.02) {
      animation = requestAnimationFrame(boucleInertie);
    } else {
      caler();
    }
  }

  cadre.addEventListener('pointerdown', surAppui);
  cadre.addEventListener('pointermove', surDeplacement);
  cadre.addEventListener('pointerup', surRelache);
  cadre.addEventListener('pointercancel', surRelache);

  rendre();

  return { index: () => mod(Math.round(pos), n) };
}

async function envoyerDeclaration(activite, minutes, effortMot) {
  carte('<p class="sous-titre">Enregistrement…</p>');
  try {
    const resultat = await api('/api/web/declarer', {
      method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ p: jeton, activite, minutes, effortMot }),
    });
    if (resultat.etoiles === null) {
      carte(`<h1>Enregistré</h1><p class="sous-titre">Tes étoiles arrivent à partir de la 3e séance.</p><div class="boutons"><button class="principal" id="ok">Menu</button></div>`);
    } else {
      carte(`<h1>${resultat.activite}</h1>${panneauEtoiles(resultat.etoiles)}<div class="boutons"><button class="principal" id="ok">Menu</button></div>`);
    }
    document.getElementById('ok').onclick = () => afficherMenu();
  } catch (e) {
    carte(`<p class="sous-titre">${e.message}</p><div class="boutons"><button class="principal" id="ok">Menu</button></div>`);
    document.getElementById('ok').onclick = () => afficherMenu();
  }
}

async function afficherMesDonnees() {
  carte('<p class="sous-titre">Chargement…</p>');
  const donnees = await api('/api/web/mesdonnees?p=' + encodeURIComponent(jeton));
  const etoiles = donnees.etoiles;
  carte(`
    <button class="retour" id="retour">← Menu</button>
    <h1>Cette semaine</h1>
    ${etoiles.length === 0
      ? '<p class="sous-titre">Aucune séance notée cette semaine.</p>'
      : etoiles.map((e) => panneauEtoiles(e)).join('')}
  `);
  document.getElementById('retour').onclick = () => afficherMenu();
}

async function confirmerSuppression() {
  if (!confirm('Supprimer toutes tes données ? Cette action est immédiate et définitive.')) return;
  await api('/api/web/supprimer', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ p: jeton }) });
  localStorage.removeItem('coeur-relatif-jeton');
  carte('<h1>Supprimé</h1><p class="sous-titre">Toutes tes données ont été effacées.</p>');
}

if ('serviceWorker' in navigator) navigator.serviceWorker.register('/sw.js').catch(() => {});
demarrer();
</script>
</body>
</html>
