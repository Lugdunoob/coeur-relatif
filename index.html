<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Cœur relatif</title>
<link rel="manifest" href="/manifest.json">
<link rel="icon" href="/icon.svg" type="image/svg+xml">
<meta name="theme-color" content="#15120f">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  :root {
    --fond: #15120f;
    --panneau: #1d1813;
    --case: #241d17;
    --case-bord: #4a3c26;
    --or: #e8b84b;
    --or-vif: #f6cf6e;
    --creme: #efe6d6;
    --creme-douce: #a99a83;
    --coeur: #d1483c;
    --seam: rgba(0,0,0,.35);
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--fond);
    background-image:
      radial-gradient(ellipse at top, rgba(232,184,75,.06), transparent 60%);
    color: var(--creme);
    font-family: "JetBrains Mono", ui-monospace, monospace;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 32px 16px calc(32px + env(safe-area-inset-bottom));
  }
  .marque {
    font-family: "Bebas Neue", "JetBrains Mono", sans-serif;
    font-size: 2.4rem;
    letter-spacing: 0.12em;
    color: var(--or-vif);
    text-shadow: 0 0 18px rgba(246,207,110,.25);
    margin: 0 0 2px;
  }
  .marque-sous {
    font-size: 0.7rem;
    letter-spacing: 0.3em;
    color: var(--creme-douce);
    text-transform: uppercase;
    margin: 0 0 28px;
  }
  .carte {
    width: 100%;
    max-width: 420px;
    background: var(--panneau);
    border: 1px solid var(--case-bord);
    border-radius: 10px;
    padding: 28px 22px;
    box-shadow: 0 20px 50px rgba(0,0,0,.4), inset 0 1px 0 rgba(255,255,255,.03);
    position: relative;
  }
  .carte::before {
    content: '';
    position: absolute; inset: 6px;
    border: 1px solid rgba(232,184,75,.12);
    border-radius: 6px;
    pointer-events: none;
  }
  h1 {
    font-family: "Bebas Neue", sans-serif;
    font-size: 1.7rem;
    letter-spacing: 0.06em;
    margin: 0 0 4px;
    color: var(--creme);
    text-transform: uppercase;
  }
  .sous-titre { color: var(--creme-douce); font-size: 0.78rem; letter-spacing: 0.05em; margin: 0 0 20px; text-transform: uppercase; }
  p { line-height: 1.6; font-size: 0.92rem; color: var(--creme-douce); }
  .boutons { display: flex; flex-direction: column; gap: 10px; margin-top: 16px; }
  button {
    font-family: "JetBrains Mono", monospace;
    font-weight: 700;
    font-size: 0.95rem;
    letter-spacing: 0.06em;
    text-transform: uppercase;
    padding: 16px 18px;
    border-radius: 6px;
    border: 1px solid var(--case-bord);
    background: var(--case);
    color: var(--or-vif);
    cursor: pointer;
    text-align: left;
    position: relative;
    box-shadow: inset 0 1px 0 rgba(255,255,255,.04), 0 2px 0 rgba(0,0,0,.3);
  }
  button::after {
    content: '';
    position: absolute; left: 12px; right: 12px; top: 50%;
    border-top: 1px solid var(--seam);
  }
  button:active { transform: translateY(1px); box-shadow: inset 0 1px 0 rgba(255,255,255,.04); }
  button.principal { background: var(--or); color: #1a1410; border-color: var(--or); text-align: center; }
  button.principal::after { border-top-color: rgba(0,0,0,.15); }
  button.discret { background: transparent; border: none; box-shadow: none; color: var(--creme-douce); text-align: center; text-decoration: underline; text-transform: none; letter-spacing: 0; font-weight: 400; }
  button.discret::after { content: none; }
  .etoiles { display: flex; justify-content: center; gap: 6px; margin: 22px 0; }
  .etoiles .case-etoile {
    width: 38px; height: 46px;
    background: var(--case);
    border: 1px solid var(--case-bord);
    border-radius: 4px;
    display: flex; align-items: center; justify-content: center;
    font-size: 1.3rem;
    color: var(--creme-douce);
    position: relative;
    animation: bascule .5s ease-out backwards;
  }
  .etoiles .case-etoile::after { content: ''; position: absolute; left: 0; right: 0; top: 50%; border-top: 1px solid var(--seam); }
  .etoiles .case-etoile.pleine { color: var(--or-vif); text-shadow: 0 0 10px rgba(246,207,110,.4); }
  @keyframes bascule { from { transform: rotateX(90deg); opacity: 0; } to { transform: rotateX(0); opacity: 1; } }
  .retour { background: none; border: none; box-shadow: none; color: var(--creme-douce); padding: 0 0 18px; text-align: left; font-size: 0.75rem; letter-spacing: 0.08em; text-transform: uppercase; }

  /* Sélecteur à roues (façon combinaison / horloge à bascule) */
  .roues { display: flex; gap: 10px; margin: 10px 0 20px; }
  .roue-colonne { flex: 1; min-width: 0; }
  .roue-entete { font-size: 0.65rem; letter-spacing: 0.15em; text-transform: uppercase; color: var(--creme-douce); text-align: center; margin-bottom: 6px; }
  .roue-cadre {
    position: relative;
    height: 180px;
    background: var(--case);
    border: 1px solid var(--case-bord);
    border-radius: 6px;
    overflow: hidden;
  }
  .roue-bande {
    position: absolute; left: 0; right: 0; top: 72px; height: 36px;
    border-top: 1px solid rgba(232,184,75,.4);
    border-bottom: 1px solid rgba(232,184,75,.4);
    background: rgba(232,184,75,.06);
    pointer-events: none;
    z-index: 2;
  }
  .roue-scroll {
    height: 100%;
    overflow-y: scroll;
    scroll-snap-type: y mandatory;
    -webkit-mask-image: linear-gradient(to bottom, transparent 0, #000 40px, #000 140px, transparent 180px);
    mask-image: linear-gradient(to bottom, transparent 0, #000 40px, #000 140px, transparent 180px);
    scrollbar-width: none;
  }
  .roue-scroll::-webkit-scrollbar { display: none; }
  .roue-remplissage { height: 72px; }
  .roue-item {
    height: 36px;
    display: flex; align-items: center; justify-content: center;
    scroll-snap-align: center;
    font-size: 0.78rem;
    color: var(--creme-douce);
    opacity: .4;
    transition: opacity .15s, color .15s, font-size .15s;
    text-align: center;
    padding: 0 4px;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  .roue-item.actif { opacity: 1; color: var(--or-vif); font-weight: 700; font-size: 0.95rem; }
  .chargement, .erreur { text-align: center; color: var(--creme-douce); margin-top: 40vh; font-size: 0.85rem; letter-spacing: 0.05em; }
  .erreur { color: var(--coeur); }
</style>
</head>
<body>
<div class="marque">CŒUR RELATIF</div>
<div class="marque-sous">Pilote · Effort relatif</div>
<div id="app" class="chargement">Chargement…</div>

<script>
const params = new URLSearchParams(location.search);
let jeton = params.get('p') || localStorage.getItem('coeur-relatif-jeton');
if (params.get('p')) localStorage.setItem('coeur-relatif-jeton', params.get('p'));

const app = document.getElementById('app');

function carte(html) {
  app.className = '';
  app.innerHTML = '<div class="carte">' + html + '</div>';
}

function panneauEtoiles(nombre) {
  let cases = '';
  for (let i = 0; i < 5; i++) {
    const pleine = i < nombre;
    cases += `<div class="case-etoile${pleine ? ' pleine' : ''}" style="animation-delay:${i * 80}ms">${pleine ? '★' : ''}</div>`;
  }
  return `<div class="etoiles">${cases}</div>`;
}

async function api(chemin, options) {
  const reponse = await fetch(chemin, options);
  const donnees = await reponse.json().catch(() => ({}));
  if (!reponse.ok) throw new Error(donnees.erreur || 'Erreur');
  return donnees;
}

async function demarrer() {
  if (!jeton) {
    app.className = 'erreur';
    app.textContent = "Lien manquant. Demande ton lien personnel au fondateur du pilote.";
    return;
  }
  try {
    const moi = await api('/api/web/moi?p=' + encodeURIComponent(jeton));
    if (!moi.consentement) {
      afficherConsentement(moi.prenom);
    } else {
      afficherMenu(moi.prenom);
    }
  } catch (e) {
    app.className = 'erreur';
    app.textContent = e.message === 'Lien invalide.' ? 'Lien invalide ou expiré.' : 'Une erreur est survenue.';
  }
}

function afficherConsentement(prenom) {
  carte(`
    <h1>Bienvenue${prenom ? ', ' + prenom : ''}</h1>
    <p class="sous-titre">Pilote « Cœur relatif »</p>
    <p>Ce qui est enregistré si tu acceptes : les activités que tu déclares (nom, durée,
    effort ressenti) et les cœurs ❤️ posés sur les séances.</p>
    <p>Ce qui n'est jamais enregistré : fréquence cardiaque, distance, allure, position,
    âge, poids — aucun de ces champs n'existe dans cette appli.</p>
    <p>Conservation : jusqu'à la fin du pilote + 30 jours, puis suppression automatique.
    Suppression à tout moment, depuis le menu.</p>
    <div class="boutons"><button class="principal" id="accepter">J'accepte</button></div>
  `);
  document.getElementById('accepter').onclick = async () => {
    await api('/api/web/accepter', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ p: jeton }) });
    demarrer();
  };
}

function afficherMenu(prenom) {
  carte(`
    <h1>Salut${prenom ? ', ' + prenom : ''}</h1>
    <p class="sous-titre">Qu'est-ce qu'on fait ?</p>
    <div class="boutons">
      <button id="declarer">Déclarer une séance</button>
      <button id="mesdonnees">Mes étoiles de la semaine</button>
      <button class="discret" id="supprimer">Supprimer mes données</button>
    </div>
  `);
  document.getElementById('declarer').onclick = demarrerDeclaration;
  document.getElementById('mesdonnees').onclick = afficherMesDonnees;
  document.getElementById('supprimer').onclick = confirmerSuppression;
}

const HAUTEUR_LIGNE = 36;

async function demarrerDeclaration() {
  const options = await api('/api/web/options');
  afficherRoues(options);
}

// Trois roues côte à côte (activité, durée, effort), comme une combinaison : on
// scrolle chaque colonne, l'élément centré (dans la bande dorée) est le choix retenu.
function afficherRoues(options) {
  const activites = [...options.activites, 'Autre'];
  const durees = options.durees.map((d) => d.label);
  const efforts = options.efforts;

  const colonne = (id, entete, valeurs) => `
    <div class="roue-colonne">
      <div class="roue-entete">${entete}</div>
      <div class="roue-cadre">
        <div class="roue-bande"></div>
        <div class="roue-scroll" id="${id}">
          <div class="roue-remplissage"></div>
          ${valeurs.map((v) => `<div class="roue-item">${v}</div>`).join('')}
          <div class="roue-remplissage"></div>
        </div>
      </div>
    </div>
  `;

  carte(`
    <button class="retour" id="retour">← Menu</button>
    <h1>Déclarer</h1>
    <p class="sous-titre">Fais défiler chaque colonne</p>
    <div class="roues">
      ${colonne('roue-activite', 'Activité', activites)}
      ${colonne('roue-duree', 'Durée', durees)}
      ${colonne('roue-effort', 'Effort', efforts)}
    </div>
    <div class="boutons"><button class="principal" id="valider">Valider</button></div>
  `);
  document.getElementById('retour').onclick = () => afficherMenu();

  const roues = ['roue-activite', 'roue-duree', 'roue-effort'].map((id) => initRoue(id));

  document.getElementById('valider').onclick = () => {
    const iActivite = roues[0].index();
    const iDuree = roues[1].index();
    const iEffort = roues[2].index();
    let activite = activites[iActivite];
    if (activite === 'Autre') {
      const nom = prompt("Quelle activité ?");
      if (!nom || !nom.trim()) return;
      activite = nom.trim().slice(0, 30);
    }
    envoyerDeclaration(activite, options.durees[iDuree].minutes, efforts[iEffort]);
  };
}

// Marque l'élément centré comme actif ; scrollTop = index * HAUTEUR_LIGNE (voir CSS :
// remplissage haut/bas de deux lignes, donc scrollTop=0 centre déjà l'élément 0).
function initRoue(id) {
  const scroll = document.getElementById(id);
  const items = scroll.querySelectorAll('.roue-item');
  let indexActif = 0;

  function maj() {
    indexActif = Math.max(0, Math.min(items.length - 1, Math.round(scroll.scrollTop / HAUTEUR_LIGNE)));
    items.forEach((el, i) => el.classList.toggle('actif', i === indexActif));
  }

  let ticheme;
  scroll.addEventListener('scroll', () => {
    clearTimeout(ticheme);
    ticheme = setTimeout(maj, 60);
  });
  maj();

  return { index: () => indexActif };
}

async function envoyerDeclaration(activite, minutes, effortMot) {
  carte('<p class="sous-titre">Enregistrement…</p>');
  try {
    const resultat = await api('/api/web/declarer', {
      method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ p: jeton, activite, minutes, effortMot }),
    });
    if (resultat.etoiles === null) {
      carte(`<h1>Enregistré</h1><p class="sous-titre">Tes étoiles arrivent à partir de la 3e séance.</p><div class="boutons"><button class="principal" id="ok">Menu</button></div>`);
    } else {
      carte(`<h1>${resultat.activite}</h1>${panneauEtoiles(resultat.etoiles)}<div class="boutons"><button class="principal" id="ok">Menu</button></div>`);
    }
    document.getElementById('ok').onclick = () => afficherMenu();
  } catch (e) {
    carte(`<p class="sous-titre">${e.message}</p><div class="boutons"><button class="principal" id="ok">Menu</button></div>`);
    document.getElementById('ok').onclick = () => afficherMenu();
  }
}

async function afficherMesDonnees() {
  carte('<p class="sous-titre">Chargement…</p>');
  const donnees = await api('/api/web/mesdonnees?p=' + encodeURIComponent(jeton));
  const etoiles = donnees.etoiles;
  carte(`
    <button class="retour" id="retour">← Menu</button>
    <h1>Cette semaine</h1>
    ${etoiles.length === 0
      ? '<p class="sous-titre">Aucune séance notée cette semaine.</p>'
      : etoiles.map((e) => panneauEtoiles(e)).join('')}
  `);
  document.getElementById('retour').onclick = () => afficherMenu();
}

async function confirmerSuppression() {
  if (!confirm('Supprimer toutes tes données ? Cette action est immédiate et définitive.')) return;
  await api('/api/web/supprimer', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ p: jeton }) });
  localStorage.removeItem('coeur-relatif-jeton');
  carte('<h1>Supprimé</h1><p class="sous-titre">Toutes tes données ont été effacées.</p>');
}

if ('serviceWorker' in navigator) navigator.serviceWorker.register('/sw.js').catch(() => {});
demarrer();
</script>
</body>
</html>
